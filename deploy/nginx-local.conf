# Add this server block inside the http block of your local Nginx configuration.
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    client_max_body_size 100m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_connect_timeout 5s;
    proxy_cookie_flags JSESSIONID httponly samesite=lax;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 401 = @unauthorized;
    location @unauthorized {
        default_type application/json;
        return 401 '{"code":401,"success":false,"message":"请先登录"}';
    }
    location = /internal/nuanxun-session {
        internal;
        proxy_pass http://127.0.0.1:8080/api/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /api/ping {
        proxy_pass http://127.0.0.1:5000;
    }
    location ~ ^/api/(extract_tags|recommend-rescuers|download-report|export-report|cleanup-temp-files|generate-summary|psych-care|generate-html-poster|mapheat|scene-train|notify-family|proxy)(/|$) {
        auth_request /internal/nuanxun-session;
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
