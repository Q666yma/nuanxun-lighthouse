<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人脸图片比对</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    :root{
      --primary:#007bff;
      --bg-grad:linear-gradient(135deg,#e0f7fa,#80deea);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
      background:var(--bg-grad);
      display:flex;
      justify-content:center;
      align-items:flex-start;   /* 允许竖向滚动 */
      min-height:100vh;
      padding:24px 8px;
    }
    /* === 容器 === */
    .container{
      display:flex;
      gap:30px;
      width:90%;
      max-width:1400px;
      background:#fff;
      padding:40px;
      border-radius:20px;
      box-shadow:0 4px 12px rgba(0,0,0,.2);
      animation:fadeIn .9s ease;
      transition:transform .3s ease;
    }
    .container:hover{transform:scale(1.02);}
    /* 主要/侧边卡片 */
    .main-card,.side-card{
      background:#fff;
      border-radius:20px;
      padding:40px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      transition:transform .3s ease,box-shadow .3s ease;
    }
    .main-card:hover,.side-card:hover{
      transform:translateY(-6px);
      box-shadow:0 8px 18px rgba(0,0,0,.18);
    }
    .main-card{flex:2;}
    .side-card{flex:1;}
    /* 文本 & 标题 */
    h1{
      font-size:clamp(24px,2.4vw,32px);
      color:var(--primary);
      margin-bottom:20px;
    }
    .instructions{font-size:clamp(14px,1.4vw,18px);color:#555;margin-bottom:20px;}
    label{display:block;font-size:clamp(14px,1.4vw,18px);margin-bottom:10px;color:#333;}
    /* 文件输入 */
    .input-icon{position:relative;width:100%;}
    .input-icon .icon{
      position:absolute;left:12px;top:50%;
      transform:translateY(-50%);
      font-size:18px;color:var(--primary);
    }
    .input-icon input{
      width:100%;
      padding:12px 16px 12px 42px;
      font-size:16px;
      border:2px solid var(--primary);
      border-radius:10px;
      outline:none;
    }
    /* 预览区 */
    #preview-container{
      margin-top:40px;
      display:flex;
      flex-wrap:wrap;
      gap:20px;
    }
    .preview-box{
      flex:1 1 240px;
      text-align:center;
    }
    .preview-box img{
      max-width:100%;
      max-height:350px;
      border-radius:10px;
      border:2px solid var(--primary);
    }
    /* 按钮 */
    button{
      background:var(--primary);
      color:#fff;
      padding:16px 32px;
      font-size:18px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      margin-top:30px;
      transition:background .3s,box-shadow .3s;
    }
    button:hover{background:#0056b3;box-shadow:0 4px 12px rgba(0,0,0,.18);}
    /* 结果文本 */
    #result,#result_temp{
      font-size:16px;
      color:#333;
      margin-top:20px;
      text-align:center;
    }
    /* 侧栏 */
    .side-card h2{font-size:20px;margin-bottom:16px;color:var(--primary);}
    .side-card p,.side-card li{font-size:14px;color:#555;margin-bottom:8px;list-style:none;}
    /* GIF & 动画 */
    .text-move-up{display:inline-block;position:relative;top:-25px;}
    .gif-image{width:64px;height:64px;margin-left:8px;}
    @keyframes fadeIn{from{opacity:.0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    /* === 移动端适配点 === */
    @media (max-width:768px){
      .container{
        flex-direction:column;          /* 上下堆叠 */
        padding:24px 20px;
      }
      .main-card,.side-card{
        padding:28px;
      }
      .side-card{order:2;}              /* 主卡片显示在前，帮助信息置后 */
      h1{text-align:center;font-size:24px;}
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 主功能卡片 -->
    <div class="main-card">
      <h1><span class="text-move-up">人脸图片比对</span><img src="../img/face.gif" alt="GIF" class="gif-image" /></h1>
      <p class="instructions">请上传清晰的照片，并选择本人参与的任务进行比对。</p>

      <form id="uploadForm">
        <div class="input-container">
          <label for="recognitionTask">本人参与的任务</label>
          <select id="recognitionTask" name="taskId" required disabled style="width:100%;padding:12px;border:2px solid var(--primary);border-radius:10px;"><option value="">正在加载任务…</option></select>
          <p id="taskScopeStatus" role="status"></p>
        </div>

        <div class="input-container">
          <label for="faceImage">上传照片</label>
          <div class="input-icon">
            <input type="file" id="faceImage" name="file" accept="image/*" required />
            <span class="icon"><i class="fas fa-camera"></i></span>
          </div>
        </div>

        <div id="preview-container">
          <div class="preview-box">
            <label>上传的图片</label>
            <img id="preview-left" style="display:none;" />
          </div>
          <div class="preview-box">
            <label>当前任务的资料图片</label>
            <img id="preview-right" style="display:none;" />
          </div>
        </div>

        <button type="submit" id="compareBtn" disabled>立即比对</button>
      </form>

      <p id="result"></p>
      <p id="result_temp"></p>
    </div>

    <!-- 侧边帮助卡片 -->
    <div class="side-card">
      <h2>帮助信息</h2>
      <p>系统会对上传的照片先做质量检测，通过后才能进行人脸搜索。</p>
      <p>请确保图片清晰、无遮挡。</p>
    </div>
  </div>

  <!-- JS 逻辑：保持原样，只把 jQuery 地址改成完整版 CDN 方便移动端 -->
  <script src="/layuimini/lib/jquery-3.4.1/jquery-3.4.1.min.js"></script>
  <script src="/js/guitu-api.js?v=20260923-features"></script>
  <script src="/js/task-selector.js?v=20260923-features"></script>
  <script src="/js/photo-utils.js?v=20261019-scope"></script>
  <script>
    const taskSelect=document.getElementById('recognitionTask');
    GuituTaskSelector.load(taskSelect,document.getElementById('taskScopeStatus'));
    let photoQualified = false;
    let preparedPhoto = null, photoVersion = 0;

    taskSelect.addEventListener('change',function(){photoVersion++;photoQualified=false;preparedPhoto=null;$('#faceImage').val('');$('#compareBtn').prop('disabled',true);$('#preview-left,#preview-right').hide();$('#result,#result_temp').text('');});
    /* 1. 选图预览 + 质量检测 */
    $('#faceImage').on('change', async function () {
      let taskId;try{taskId=GuituTaskSelector.requireTask(taskSelect);}catch(error){$('#result').text(error.message);return;}
      let file = this.files[0];
      const version = ++photoVersion;
      photoQualified = false; preparedPhoto = null;
      $('#compareBtn').prop('disabled', true);
      $('#preview-right').hide(); $('#result_temp').text('');
      if (!file) return;
      try { file = await GuituPhotos.prepare(file); }
      catch(error) { if (version === photoVersion) $('#result').text(error.message).css('color', 'red'); return; }
      if (version !== photoVersion) return;
      const reader = new FileReader();
      reader.onload = e => $('#preview-left').attr('src', e.target.result).show();
      reader.readAsDataURL(file);

      $('#compareBtn').prop('disabled', true);
      $('#result').text('正在检测照片质量...').css('color', '#333');

      const fd = new FormData();
      fd.append('file', file);fd.append('taskId',taskId);
      $.ajax({
        url: '/face/checkQuality',
        type: 'POST',
        data: fd,
        processData: false,
        contentType: false,
        success: res => {
          if (version !== photoVersion) return;
          photoQualified = res.qualified;
          if (photoQualified) {
            preparedPhoto = file;
            $('#result').text('照片质量检测通过 ✔').css('color', 'green');
            $('#compareBtn').prop('disabled', false);
          } else {
            $('#result').text(res.message || res.msg || '照片质量不合格，请重新选择').css('color', 'red');
          }
        },
        error: xhr => {
          if (version !== photoVersion) return;
          photoQualified = false;
          const data = xhr.responseJSON || {};
          $('#result').text(data.message || data.msg || '照片检测服务暂时不可用，请稍后重试').css('color', 'red');
        }
      });
    });

    /* 2. 提交表单进行人脸搜索 */
    $('#uploadForm').submit(function (e) {
      e.preventDefault();
      if ($('#compareBtn').prop('disabled')) return;
      if (!photoQualified) {
        alert('请先上传一张合格的照片');
        return;
      }

      let taskId;try{taskId=GuituTaskSelector.requireTask(taskSelect);}catch(error){$('#result').text(error.message);return;}
      const fd = new FormData();
      fd.append('file', preparedPhoto);fd.append('taskId',taskId);taskSelect.disabled=true;
      $('#compareBtn').prop('disabled', true);
      $('#result').text('正在比对当前任务…'); $('#result_temp').text(''); $('#preview-right').hide();
      $.ajax({
        url: '/face/compare',
        type: 'POST',
        data: fd,
        processData: false,
        contentType: false,
        success: raw => {
          let res;
          try { res = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(error) { $('#result').text('搜索响应异常，请重试'); return; }
          if (res.lostPerson && res.lostPerson !== '无') {
            $('#result_temp').text('走失人员：' + res.lostPerson);
            $('#result').text('相似度：' + res.similarity + '%。这是可能匹配，请结合照片和身份信息人工确认。');
            $('#preview-right').attr('src', res.img).show();
          } else {
            $('#result').text('未找到匹配人员');
            $('#preview-right').hide();
          }
        },
        error: xhr => { const data = xhr.responseJSON || {}; $('#result').text(data.message || data.msg || '人脸搜索服务暂时不可用，请稍后重试').css('color','red'); },
        complete: () => {taskSelect.disabled=false;$('#compareBtn').prop('disabled', !photoQualified);}
      });
    });
  </script>
</body>
</html>
