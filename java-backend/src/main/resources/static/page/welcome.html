<script>
    document.querySelectorAll('.video-wall video').forEach(function (video, index) {
        var playlist = index === 0 ? ['/video/1.MP4', '/video/2.MP4'] : ['/video/3.MP4', '/video/4.MP4', '/video/5.MP4'];
        var current = 0;
        video.loop = false;
        video.playsInline = true;
        video.controls = true;
        // Keep the original video area, but reserve bandwidth until the user presses Play.
        video.src = playlist[current];
        var visible = false;
        function updatePlayback() {
            if (!visible || document.hidden) video.pause();
        }
        video.addEventListener('ended', function () {
            current = (current + 1) % playlist.length;
            video.src = playlist[current];
            if (visible && !document.hidden) {
                var attempt = video.play();
                if (attempt) attempt.catch(function () {});
            }
        });
        document.addEventListener('visibilitychange', updatePlayback);
        if ('IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function (entries) {
                visible = entries[0].isIntersecting;
                updatePlayback();
            });
            observer.observe(video);
        } else {
            function checkVisibility() {
                var rect = video.getBoundingClientRect();
                visible = rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.right > 0
                    && rect.top < window.innerHeight && rect.left < window.innerWidth;
                updatePlayback();
            }
            window.addEventListener('scroll', checkVisibility, {passive: true});
            window.addEventListener('resize', checkVisibility);
            checkVisibility();
        }
    });
</script>

<script>
    layui.use(['layer', 'miniTab'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            miniTab = layui.miniTab;
            

        miniTab.listen();
        var $quick = $('.layuimini-qiuck');
        var $quickStatus = $('<p role="status"></p>').hide().insertAfter($quick);
        function loadQuickEntries() {
            $quick.css('visibility', 'hidden').attr('aria-busy', 'true');
            $quickStatus.hide().empty();
            $.when(
                $.getJSON('/api/users/getCurrentUser'),
                $.getJSON('/layuimini/api/init.json?v=20261020-overview')
            ).done(function (userResult, menuResult) {
                var user = userResult[0], menu = menuResult[0];
                if (!user || !user.uuid || ['family', 'rescuer', 'admin'].indexOf(user.userType) < 0 || !menu || !Array.isArray(menu.menuInfo) || !window.GuituRoleNavigation) {
                    showQuickError(); return;
                }
                var filtered = GuituRoleNavigation.filterMenu(user, menu), entries = [];
                function collect(items) { items.forEach(function(item){if(item.child) collect(item.child);else if(item.href)entries.push(item);}); }
                collect(filtered.menuInfo);
                $quick.find('[layuimini-content-href]').each(function (index) {
                    var entry = entries[index], $link = $(this);
                    $link.closest('.layuimini-qiuck-module').toggle(!!entry);
                    if (entry) {
                        $link.attr({'layuimini-content-href':'/'+entry.href, 'data-title':entry.title, 'data-icon':entry.icon});
                        $link.find('cite').text(entry.title);$link.find('i').attr('class',entry.icon);
                    }
                });
                loadPersonalSummary(user);
                $quick.css('visibility', 'visible').attr('aria-busy', 'false');
            }).fail(function (xhr) {
                if (xhr.status === 401) { window.location.replace('/login'); return; }
                showQuickError();
            });
        }
        function showQuickError() {
            $quick.attr('aria-busy', 'false');
            $quickStatus.empty().append(document.createTextNode('快捷入口暂时无法加载 '))
                .append($('<button type="button" class="layui-btn layui-btn-primary layui-btn-sm">重试</button>').on('click', loadQuickEntries)).show();
        }
        loadQuickEntries();

        function summaryValue(id,label,value) {
            var $value=$('#'+id);$value.text(value);$value.closest('.panel-body').find('h5').text(label);
            $value.siblings('small').text('当前账号的真实记录');
        }
        function loadPersonalSummary(user) {
            $('#tag-container').empty();
            $.getJSON('/api/notifications?unread=true&page=1&limit=1').done(function(res){if(res.success&&Number.isFinite(res.count))$('<a class="layui-badge layui-bg-green"></a>').attr('href','/page/messages.html?v=20260923-features').text('未读消息 '+res.count).appendTo('#tag-container');});
            $.getJSON('/api/content?kind=announcement&page=1&limit=5').done(function(res){
                if(!res.success||!Array.isArray(res.data))return;
                res.data.forEach(function(record){var notice=$('<div class="layuimini-notice" role="button" tabindex="0"></div>');$('<div class="layuimini-notice-title"></div>').text(record.title).appendTo(notice);$('<div class="layuimini-notice-extra"></div>').text(String(record.createdAt||'').slice(0,10)).appendTo(notice);$('<div class="layuimini-notice-content" hidden></div>').text(record.body).appendTo(notice);notice.on('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$(this).click();}});notice.appendTo('#tag-container');});
            });
            if(user.userType==='rescuer' && user.rescuerStatus!=='available') {
                summaryValue('total_people','申请状态',({visitor:'未申请',pending:'待审核',rejected:'未通过',disabled:'已停用'})[user.rescuerStatus]||'待确认');
                summaryValue('rescuing','任务执行','审核后开放');summaryValue('rescued','当前可用','资料与培训');summaryValue('success_rate','下一步','查看申请状态');return;
            }
            if(user.userType==='admin') {
                $.getJSON('/api/admin/summary').done(function(res){var d=res.data||{};summaryValue('total_people','待审核队员',d.pendingRescuers);summaryValue('rescuing','进行中任务',d.activeTasks);summaryValue('rescued','待处理加急',d.pendingUrgent);summaryValue('success_rate','平台账号',d.users);}).fail(summaryError);return;
            }
            var family=user.userType==='family', page=1, rows=[];
            function next() {
                $.getJSON((family?'/task/list':'/task/my-list-data')+'?page='+page+'&limit=100').done(function(res){
                    var batch=family?res.data&&res.data.records:res.data, count=family?res.data&&res.data.total:res.count;
                    if(res.code!==0||!Array.isArray(batch)){summaryError();return;}
                    rows=rows.concat(batch);if(batch.length&&rows.length<count){page++;next();return;}
                    summaryValue('total_people',family?'我的求助':'我的搜救',rows.length);
                    summaryValue('rescuing','进行中',rows.filter(function(t){return t.status==='waiting'||t.status==='rescuing';}).length);
                    summaryValue('rescued','已确认完成',rows.filter(function(t){return t.status==='finished';}).length);
                    summaryValue('success_rate','待家属确认',rows.filter(function(t){return t.status==='confirming';}).length);
                }).fail(summaryError);
            }
            next();
        }
        function summaryError(){ $('#total_people,#rescuing,#rescued,#success_rate').text('暂不可用'); }
        $('body').on('click', '.layuimini-notice', function () {
            var title = $('<span>').text($(this).children('.layuimini-notice-title').text()).html(),
                noticeTime = $('<span>').text($(this).children('.layuimini-notice-extra').text()).html(),
                content = $(this).find('.layuimini-notice-content').html(); // 改为使用 find 获取内容

            var html = '<div style="padding:15px 20px; text-align:justify; line-height: 22px;border-bottom:1px solid #e2e2e2;background-color: #2f4056;color: #ffffff">\n' +
                '<div style="text-align: center;margin-bottom: 20px;font-weight: bold;border-bottom:1px solid #718fb5;padding-bottom: 5px"><h4 class="text-danger">' + title + '</h4></div>\n' +
                '<div style="font-size: 12px">' + content + '</div>\n' +
                '</div>\n';
            (parent.layer || layer).open({
                type: 1,
                title: '系统公告'+'<span style="float: right;right: 1px;font-size: 12px;color: #b1b3b9;margin-top: 1px">'+noticeTime+'</span>',
                area: '300px;',
                shade: 0.8,
                id: 'layuimini-notice',
                btn: ['取消'],
                btnAlign: 'c',
                moveType: 1,
                content:html,
                success: function (layero) {
                    var btn = layero.find('.layui-layer-btn');
                    btn.find('.layui-layer-btn0').attr({
                        target: '_blank'
                    });
                }
            });
        });
        if(typeof echartsRecords !== "undefined") echartsRecords.setOption(optionRecords);

        // echarts 窗口缩放自适应
        window.onresize = function(){
            if(typeof echartsRecords !== "undefined") echartsRecords.resize();
        }

    });
