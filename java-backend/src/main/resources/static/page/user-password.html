<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><title>修改密码</title><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/layuimini/lib/layui-v2.5.5/css/layui.css"><link rel="stylesheet" href="/layuimini/css/public.css">
</head>
<body>
<div class="layuimini-container"><div class="layuimini-main">
  <h2 style="margin-bottom:24px">修改密码</h2>
  <form class="layui-form" style="max-width:640px">
    <div class="layui-form-item"><label class="layui-form-label">当前密码</label><div class="layui-input-block"><input type="password" name="currentPassword" autocomplete="current-password" lay-verify="required" maxlength="72" placeholder="请输入当前密码" class="layui-input"></div></div>
    <div class="layui-form-item"><label class="layui-form-label">新密码</label><div class="layui-input-block"><input type="password" name="newPassword" autocomplete="new-password" lay-verify="required" maxlength="72" placeholder="至少 8 个字符" class="layui-input"></div></div>
    <div class="layui-form-item"><label class="layui-form-label">确认新密码</label><div class="layui-input-block"><input type="password" name="confirmPassword" autocomplete="new-password" lay-verify="required" maxlength="72" placeholder="请再次输入新密码" class="layui-input"></div></div>
    <div class="layui-form-item"><div class="layui-input-block"><button id="saveBtn" class="layui-btn layui-btn-normal" lay-submit lay-filter="savePassword">保存新密码</button><p class="layui-word-aux" style="margin-top:12px">修改成功后，请使用新密码重新登录。</p></div></div>
  </form>
</div></div>
<script src="/layuimini/lib/layui-v2.5.5/layui.js"></script>
<script>
layui.use(['jquery','form','layer'], function () {
  var $ = layui.jquery, form = layui.form, layer = layui.layer;
  form.on('submit(savePassword)', function (event) {
    if ($('#saveBtn').prop('disabled')) return false;
    var data = event.field;
    if (data.newPassword.length < 8 || new TextEncoder().encode(data.newPassword).length > 72) { layer.msg('新密码需要至少 8 个字符，且 UTF-8 编码不超过 72 字节'); return false; }
    if (data.newPassword !== data.confirmPassword) { layer.msg('两次输入的新密码不一致'); return false; }
    if (data.currentPassword === data.newPassword) { layer.msg('新密码不能与当前密码相同'); return false; }
    $('#saveBtn').prop('disabled', true);
    $.ajax({url:'/api/users/password',type:'POST',contentType:'application/json',data:JSON.stringify({currentPassword:data.currentPassword,newPassword:data.newPassword}),
      success:function (result) {
        if (result.success) { localStorage.removeItem('loginUser'); localStorage.removeItem('userType'); layer.msg('密码已修改，请重新登录',{icon:1,time:1200},function () { window.top.location.href='/login'; }); }
        else { layer.msg(result.message || '修改失败',{icon:2}); $('#saveBtn').prop('disabled',false); }
      },
      error:function (xhr) { var result = xhr.responseJSON || {}; layer.msg(result.message || '修改失败，请稍后重试',{icon:2}); $('#saveBtn').prop('disabled',false); if (xhr.status === 401) window.top.location.href='/login'; }
    });
    return false;
  });
});
</script>
</body></html>
