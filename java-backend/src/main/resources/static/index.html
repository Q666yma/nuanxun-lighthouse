    <script>
    (function () {
        // Start account/menu reads before the UI module chain. Nothing is persisted.
        window.GuituBootstrapMenuUrl = '/layuimini/api/init.json?v=20261020-overview';
        function readJson(url, privateData) {
            var controller = new AbortController();
            var timer = setTimeout(function () {controller.abort();}, 12000);
            return fetch(url, {credentials: 'same-origin', cache: privateData ? 'no-store' : 'default', signal: controller.signal})
                .then(function (response) {
                    if (!response.ok) {var error = new Error('导航信息读取失败'); error.status = response.status; throw error;}
                    return response.json();
                }).finally(function () {clearTimeout(timer);});
        }
        window.GuituLoadNavigation = function () {
            return Promise.all([readJson('/api/users/getCurrentUser', true), readJson(window.GuituBootstrapMenuUrl, false)]);
        };
        window.GuituNavigationReady = window.GuituLoadNavigation();
        window.GuituNavigationReady.then(function (result) {
            if (result[0] && result[0].userType === 'admin') {
                ['/js/guitu-api.js?v=20260923-features', '/js/admin-ui.js?v=20261019-load'].forEach(function (url) {
                    var link = document.createElement('link'); link.rel = 'preload'; link.as = 'script'; link.href = url;
                    document.head.appendChild(link);
                });
            }
        }).catch(function () {});
    })();
    </script>

<script>
    layui.use(['jquery', 'layer', 'miniAdmin'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            miniAdmin = layui.miniAdmin;

        miniAdmin.deleteLoader = function () {
            $('.layuimini-loader').remove();
        };

        var options = {
            iniUrl: window.GuituBootstrapMenuUrl,    // 初始化接口
            clearUrl: "layuimini/api/clear.json", // 缓存清理接口
            urlHashLocation: true,      // 是否打开hash定位
            bgColorDefault: false,      // 主题默认配置
            multiModule: true,          // 是否开启多模块
            menuChildOpen: false,       // 是否默认展开菜单
            loadingTime: 0,             // 初始化加载时间
            pageAnim: true,             // iframe窗口动画
            maxTabNum: 20,              // 最大的tab打开数量
        };

        function showNavigationError() {
            miniAdmin.deleteLoader();
            $('#loginUserDisplay').text('账号信息暂时不可用');
            layer.confirm('账号或菜单信息加载失败，请重试。', {
                icon: 2, title: '加载失败', btn: ['重试', '重新登录']
            }, function (index) {
                layer.close(index);
                loadNavigation();
            }, function () {
                window.location.replace('/login');
            });
        }

        function guardNavigation(user, homeHref) {
            var navigation = window.GuituRoleNavigation;
            var element = layui.element;
            var originalTabAdd = element.tabAdd;

            function returnHome() {
                history.replaceState(null, '', location.pathname + location.search + '#/' + homeHref);
                element.tabChange('layuiminiTab', homeHref);
            }

            function checkHash() {
                var href = location.hash.replace(/^#\/?/, '');
                if (!href) return;
                if (!navigation.isAllowed(user, href)) { returnHome(); return; }
                var targetUrl = new URL(href, location.origin + '/');
                var homeUrl = new URL(homeHref, location.origin + '/');
                if (targetUrl.origin === homeUrl.origin && targetUrl.pathname === homeUrl.pathname && targetUrl.searchParams.get('view') === homeUrl.searchParams.get('view') && href !== homeHref) {
                    returnHome();
                }
            }

            // All shell and iframe helpers eventually add their tab through this element instance.
            element.tabAdd = function (filter, tab) {
                if (filter === 'layuiminiTab' && tab) {
                    var holder = document.createElement('div');
                    holder.innerHTML = typeof tab.content === 'string' ? tab.content : '';
                    var frame = holder.querySelector('iframe');
                    var href = frame ? frame.getAttribute('src') : tab.id;
                    if (!navigation.isAllowed(user, href)) {
                        returnHome();
                        layer.msg('当前身份无法使用此功能', {icon: 0});
                        return this;
                    }
                }
                return originalTabAdd.apply(this, arguments);
            };
            checkHash();
            window.addEventListener('hashchange', checkHash);
            try {
                Object.keys(sessionStorage).forEach(function (key) {
                    var prefix = 'layuiminimenu_';
                    if (key.indexOf(prefix) === 0 && !navigation.isAllowed(user, key.slice(prefix.length))) {
                        sessionStorage.removeItem(key);
                    }
                });
            } catch (error) {}
        }

        function loadNavigation() {
            var request = window.GuituNavigationReady || window.GuituLoadNavigation();
            window.GuituNavigationReady = null;
            request.then(function (result) {
                var user = result[0], data = result[1];
                if (!user || !user.uuid) { window.location.replace('/login'); return; }
                if ((['family', 'rescuer', 'admin'].indexOf(user.userType) === -1) || !data || !Array.isArray(data.menuInfo)) {
                    showNavigationError();
                    return;
                }
                var role = {family:'家属',rescuer:'搜救者',admin:'管理员'}[user.userType];
                $('#loginUserDisplay').text((user.name || user.username) + '（' + role + '）');
                options.iniData = window.GuituRoleNavigation.filterMenu(user, data);
                guardNavigation(user, options.iniData.homeInfo.href);
                miniAdmin.render(options);
            }).catch(function (xhr) {
                if (xhr.status === 401 || xhr.status === 403) window.location.replace('/login');
                else showNavigationError();
            });
        }

        loadNavigation();

        $('.login-out').on('click', function () {
            var button = $(this);
            if (button.data('busy')) return;
            button.data('busy', true);
            $.post('/api/users/logout').done(function () {
                ['loginUser', 'userType', 'scene_sid', 'psych_session_id'].forEach(function (key) { localStorage.removeItem(key); });
                window.location.replace('/login');
            }).fail(function () {
                button.data('busy', false);
                layer.msg('退出失败，请重试', {icon: 2});
            });
        });
    });

</script>
